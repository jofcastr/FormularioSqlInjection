<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Usuario</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 400px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
            color: #555;
        }

        input[type="text"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #resultado {
            margin-top: 20px;
            padding: 10px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .error {
            color: red;
            font-size: 14px;
            margin-top: -10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Consulta de Usuario</h1>
        <form  method="post">
            {% csrf_token %}
            <label for="user_id">ID del Usuario:</label>
            <input type="text" id="user_id" name="user_id" required>
            <span class="error" id="error"></span>
            <button type="submit">Consultar</button>
            <div class="text-danger" style="color: red; font-weight: bold;">
                {{ error }}
            </div>
        </form>

        {% if resultado %}                    
        <div id="resultado">
            <h2>Resultado:</h2>
            <p>Nombre: {{ nombre }}</p>
            <p>Apellido: {{ apellido }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
